# ld65 config: C128 BASIC-stub program loaded at $1C01 (BASIC start after
# power-on). The stub is "10 SYS 7184"; code starts at $1C10 (7184).
# MAINTOP is the highest load address allowed (set per program with
# -D MAINTOP=...); the diagnostics keep the ROMs in and must stay below $4000.
SYMBOLS {
    MAINTOP: type = weak, value = $4000;
}
MEMORY {
    ZP:       file = "",  start = $0002, size = $00FE, define = yes;
    LOADADDR: file = %O, start = $1BFF, size = $0002;
    STUB:     file = %O, start = $1C01, size = $000F, fill = yes;
    MAIN:     file = %O, start = $1C10, size = MAINTOP - $1C10, define = yes;
    BSSMEM:   file = "",  start = __MAIN_LAST__, size = MAINTOP - __MAIN_LAST__;
}
SEGMENTS {
    ZEROPAGE: load = ZP,       type = zp;
    LOADADDR: load = LOADADDR, type = ro;
    STUB:     load = STUB,     type = ro;
    CODE:     load = MAIN,     type = ro;
    RODATA:   load = MAIN,     type = ro;
    DATA:     load = MAIN,     type = rw;
    BSS:      load = BSSMEM,   type = bss, define = yes;
}
